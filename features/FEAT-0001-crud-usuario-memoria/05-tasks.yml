    objective: Implementar errorMiddleware y notFoundMiddleware que traduzcan errores al contrato uniforme y registren errores no controlados como INTERNAL_ERROR.
    requirements: [RN008]
    design: [DES004]
    decisions: [ADR003]
    expected_output:
      files:
        - src/middleware/errorMiddleware.ts
        - src/middleware/notFoundMiddleware.ts
    validation:
      command: npx tsc --noEmit
      result: PASSED
      done_when:
        - compiles_without_errors
        - error_contract_mapper_implemented
        - unknown_errors_mapped_to_internal_error
    evidence:
      - "npx tsc --noEmit finaliza con EXIT=0 sobre src/middleware/errorMiddleware.ts y src/middleware/notFoundMiddleware.ts; npx eslint sobre ambos archivos finaliza con EXIT=0."
      - "errorMiddleware (firma de 4 argumentos) implementa el mapeo al contrato uniforme { error: { code, message, details? } }: AppError se responde con su statusCode/code, ValidationError ademas expone details (DES004)."
      - "Errores no controlados se registran con logging estructurado JSON (level/event/code/name/message/stack, sin payloads ni datos sensibles, RN008) y se responden como INTERNAL_ERROR 500 con mensaje generico y sin stack trace."
      - "Si res.headersSent, delega en el handler por defecto con next(error)."
      - "notFoundMiddleware convierte rutas no encontradas en NotFoundError y las propaga con next(error), manteniendo un unico punto de render del contrato."
      - "Verificacion runtime con Express + Supertest: payload invalido -> 400 VALIDATION_ERROR con details[0].field='email'; ConflictError -> 409 EMAIL_ALREADY_EXISTS; ValidationError -> 400 con details; NotFoundError -> 404 USER_NOT_FOUND; ruta inexistente -> 404 USER_NOT_FOUND 'Route not found'; Error desconocido -> 500 INTERNAL_ERROR sin stack ni mensaje interno en el body."
      - "Validacion global del paquete WP04: npx tsc --noEmit finaliza con EXIT=0."
    modified_files:
      - src/middleware/errorMiddleware.ts
      - src/middleware/notFoundMiddleware.ts

