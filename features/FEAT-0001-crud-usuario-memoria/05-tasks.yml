    evidence:
      - "npx tsc --noEmit finaliza con EXIT=0 sobre src/validators/userValidator.ts (TypeScript strict)."
      - "createUserSchema: name string 1-100 con trim y email valido max 254 transformado a minusculas, segun DES005 (RN002, RN003)."
      - "updateUserSchema: objeto parcial estricto con al menos un campo (name y/o email) y strict() para rechazar campos desconocidos (RN005)."
      - "validateBody(schema) ejecuta schema.parse(req.body), reemplaza req.body por el payload normalizado y propaga ValidationError con details ({field, message}) via next(error); no responde directamente."
      - "Verificacion runtime con ts-node: name '  Ada Lovelace  ' -> 'Ada Lovelace'; email '  Ada@Example.COM ' -> 'ada@example.com'; se rechazan email invalido, name vacio, name ausente, campo desconocido (role), update vacio y update con id; payload invalido produce ValidationError code=VALIDATION_ERROR statusCode=400 con details[0].field='email'."
