  T002:
    name: Implement in-memory book repository
    status: COMPLETED
    completed_at: "2026-10-01T21:19:14-05:00"
    layer: repository
    artifact_type: node.repository
    template:
      id: node.repository
      path: templates/node/repository.md
      version: 1
    objective: Implementar BookRepository e InMemoryBookRepository con Map, incluyendo save, findById, findByIsbn sobre ISBN normalizado, findAll y delete.
    requirements: [RN001, RN006, RN008]
    design: [DES006]
    decisions: [ADR004]
    expected_output:
      files:
        - src/repositories/inMemoryBookRepository.ts
    validation:
      command: npx tsc --noEmit
      result: PASSED
      done_when:
        - compiles_without_errors
        - repository_interface_implemented
        - findByIsbn_compares_normalized_isbn
        - new_instance_starts_empty
    evidence:
      - "src/repositories/inMemoryBookRepository.ts define la interfaz BookRepository (save, findById, findByIsbn, findAll, delete) segun DES006, con metodos async que devuelven Promise (ADR004)."
      - "InMemoryBookRepository implementa la interfaz con un Map<string, Book> privado que arranca vacio en cada instancia, de modo que cada instancia empieza sin datos (RN008)."
      - "findByIsbn normaliza el ISBN de entrada (trim, elimina espacios y guiones, convierte x final a X) y lo compara contra el ISBN persistido, evaluando la unicidad sobre la forma canonica (RN001 / RN004 / ADR005)."
      - "save persiste por book.id, findById/delete usan el Map por id y findAll devuelve Array.from de los valores."
      - "Patron replicado de src/repositories/inMemoryUserRepository.ts (FEAT-0001) sin modificarlo."
      - "npx tsc --noEmit finaliza con EXIT=0; npx eslint sobre el archivo finaliza con EXIT=0."
    modified_files:
      - src/repositories/inMemoryBookRepository.ts

  T003:
    name: Implement BookService with book CRUD business rules
    status: COMPLETED
    completed_at: "2026-10-01T21:23:30-05:00"
    layer: service
    artifact_type: node.service
    template:
      id: node.service
      path: templates/node/service.md
      version: 1
    objective: Implementar BookService con create, list, getById, update y delete aplicando las reglas RN001-RN008, sin dependencia de HTTP.
    requirements: [RN001, RN004, RN005, RN006, RN007]
    design: [DES007]
    decisions: [ADR002, ADR004]
    expected_output:
      files:
        - src/services/bookService.ts
    validation:
      command: npx tsc --noEmit
      result: PASSED
      done_when:
        - compiles_without_errors
        - service_has_no_http_dependency
        - isbn_conflict_and_not_found_errors_raised
        - published_year_defaults_to_null
    evidence:
      - "src/services/bookService.ts define BookService dependiendo solo de BookRepository (sin importar Express ni objetos req/res) segun DES007 y el patron de src/services/userService.ts (ADR002/ADR004)."
      - "create normaliza isbn (trim, sin espacios/guiones, x final a X), valida duplicado con findByIsbn y lanza IsbnConflictError (409, ISBN_ALREADY_EXISTS; RN001), genera id con generateId (UUID v4), aplica trim a title/author, fija publishedYear a null cuando se omite (RN005) y setea createdAt/updatedAt (RN006)."
      - "getById y delete lanzan BookNotFoundError (404, BOOK_NOT_FOUND) cuando el libro no existe (RN007); list delega en findAll (CA004)."
      - "update valida existencia (BookNotFoundError), permite conservar el propio ISBN y lanza IsbnConflictError si el ISBN pertenece a otro libro (RN001), aplica solo title/author/isbn/publishedYear (ignora id/createdAt/updatedAt del cliente), preserva id/createdAt y refresca updatedAt (RN009)."
      - "Verificacion funcional con ts-node: publishedYear null por defecto, ISBN normalizado a 9780132350884, conflictos IsbnConflictError/BookNotFoundError, actualizacion parcial y delete con list vacio (todas en verde)."
      - "npx tsc --noEmit finaliza con EXIT=0; npx eslint sobre src/services/bookService.ts finaliza con EXIT=0."
    modified_files:
      - src/services/bookService.ts

  T004:
    name: Extract shared validateBody middleware and add Zod book schemas
    status: COMPLETED
    completed_at: "2026-10-01T22:15:00-05:00"
    layer: validator
    artifact_type: node.validator
    template:
      id: node.validator
      path: templates/node/validator.md
      version: 1
    objective: Extraer el middleware validateBody a un modulo compartido, re-exportarlo desde userValidator y definir createBookSchema/updateBookSchema con normalizacion y validacion de ISBN.
    requirements: [RN002, RN003, RN004, RN005, RN009]
    design: [DES005]
    decisions: [ADR003, ADR005]
    expected_output:
      files:
        - src/validators/validateBody.ts
        - src/validators/userValidator.ts
        - src/validators/bookValidator.ts
    validation:
      command: npx tsc --noEmit
      result: PASSED
      done_when:
        - compiles_without_errors
        - user_routes_import_path_unchanged
        - book_schemas_reject_invalid_payloads
        - isbn_normalization_and_checksum_enforced
        - update_schema_requires_at_least_one_field
    evidence:
      - "src/validators/validateBody.ts aloja el middleware validateBody(schema) mas sus helpers toValidationError/toErrorDetails extraidos desde userValidator, segun DES005 y ADR003, reutilizable sin import cruzado entre features."
      - "src/validators/userValidator.ts conserva createUserSchema/updateUserSchema y re-exporta validateBody desde el modulo compartido; src/routes/userRoutes.ts mantiene sin cambios el import desde '../validators/userValidator' (user_routes_import_path_unchanged)."
      - "src/validators/bookValidator.ts define createBookSchema y updateBookSchema estrictos (rechazan campos desconocidos) con title trim 1-200 (RN002), author trim 1-150 (RN003) y publishedYear entero 1450..anio+1 opcional (RN005)."
      - "El ISBN se normaliza (trim, eliminacion de espacios/guiones, x final a X) y se valida el digito de control ISBN-10 (mod 11, X=10) o ISBN-13 (mod 10, pesos 1/3); se verifico con ts-node el rechazo de '9780132350885', '0306406153' y 'not-an-isbn' y la aceptacion/normalizacion de '978-0-13-235088-4' y '0-8044-2957-x' (RN004 / ADR005)."
      - "updateBookSchema exige al menos un campo de title/author/isbn/publishedYear: '{}' y '{ id: \"x\" }' fallan y '{ title: \"New\" }' pasa (RN009)."
      - "Verificacion funcional con ts-node: 20 aserciones en verde, incluyendo la re-exportacion de validateBody, el contrato de usuarios intacto y la propagacion de ValidationError con details {field,message}."
      - "npx tsc --noEmit finaliza con EXIT=0; npx eslint sobre los tres validadores finaliza con EXIT=0; la suite existente de usuarios (tests/controllers, tests/services, tests/repositories) pasa 49/49 sin cambios."
    modified_files:
